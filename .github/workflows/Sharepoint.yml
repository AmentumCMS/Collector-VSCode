name: VSCode Main Collection Sharepoint Upload
on:
  release:
    types: [edited, released]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to process (example: YYYYMMDD-HHMM)"
        required: true
        type: string

jobs:
  Context:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
    steps:
      - name: Resolve release tag
        id: resolve
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ inputs.release_tag }}"
          fi

          if [ -z "$TAG" ]; then
            echo "No release tag was provided."
            exit 1
          fi

          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using release tag: $TAG"

  Sharepoint:
    runs-on: ubuntu-latest
    needs: [Context]
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
        with:
          submodules: true
          lfs: true

      - name: Determine runner mounts
        run: |
          sudo echo -e "Disk freespace and mounts\n$(df -hT)\n\n$(mount)" | tee runner-disks.txt

      - name: Find latest successful run on default branch
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DEFAULT_BRANCH=$(gh repo view --json defaultBranchRef -q '.defaultBranchRef.name')

          RUN_ID=$(gh run list \
            --branch "$DEFAULT_BRANCH" \
            --status success \
            --limit 1 \
            --json databaseId \
            -q '.[0].databaseId')

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ steps.run.outputs.run_id }}" \
            --dir release-assets

      - name: Show contents
        run: |
          find release-assets

      - name: Download release assets for selected tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.Context.outputs.release_tag }}
        shell: bash
        run: |
          mkdir -p release-assets
          gh release download "$TAG" \
            --dir release-assets \
            --pattern "${{ vars.COLLECTOR }}-*"

      - name: Show downloaded files
        run: ls -1sh release-assets | tee artifact-listing.txt

      - name: Validate Artifacts
        shell: bash
        working-directory: release-assets
        run: |
          echo -e "Artifacts Downloaded\n$(find . -type f -iname '*sha' -execdir sha256sum -c {} \;)"

      # Upload files to SharePoint
      - name: Send Files to Sharepoint
        uses: cringdahl/sharepoint-file-upload-action@v1.4.1
        with:
          file_path: "release-assets/*"
          host_name: "${{ secrets.SHAREPOINT_HOST }}"
          site_name: "${{ secrets.SHAREPOINT_SITE }}"
          upload_path: "${{ secrets.SHAREPOINT_BASEPATH }}/${{ vars.COLLECTOR }}/${{ needs.Context.outputs.release_tag }}"
          tenant_id: ${{ secrets.SHAREPOINT_TENANT_ID }}
          client_id: ${{ secrets.SHAREPOINT_APP_ID }}
          client_secret: ${{ secrets.SHAREPOINT_APP_SECRET }}
          login_endpoint: "login.microsoftonline.us"
          graph_endpoint: "graph.microsoft.us"
